<body>

<div class="container">

<header>
<div class="logo">RASHEED_FX</div>
<div class="subtitle">Live Foreign Exchange Rates</div>
</header>

<section class="section">

<h2>Today's Exchange Rates</h2>

<div id="ratesList">Loading exchange rates...</div>

<div class="status" id="lastUpdated">
Connecting to server...
</div>

</section>

<section class="section">

<h2>Currency Calculator</h2>

<label>Choose currency</label>

<select id="calculatorCurrency">
<option value="USD">US Dollar (USD)</option>
<option value="EUR">Euro (EUR)</option>
<option value="GBP">British Pound (GBP)</option>
<option value="USDT">Tether (USDT)</option>
</select>

<label>Enter amount</label>

<input type="number" id="amount" placeholder="Enter amount" min="0">

<label>Choose rate</label>

<select id="rateType">
<option value="sell">Selling rate</option>
<option value="buy">Buying rate</option>
</select>

<button class="gold-button" onclick="calculate()">
Calculate
</button>

<div class="result" id="calculationResult">
₦0.00
</div>

</section>

<section class="history">

<h2>Exchange Rate History</h2>

<div class="history-controls">

<select id="historyCurrency">
<option value="USD">USD</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
<option value="USDT">USDT</option>
</select>

<button class="history-button active" id="days7" onclick="changeDays(7)">
7 Days
</button>

<button class="history-button" id="days30" onclick="changeDays(30)">
30 Days
</button>

</div>

<div class="chart-wrap">
<canvas id="historyChart"></canvas>
</div>

<div class="chart-legend">
<span><i class="dot green"></i>Buy rate</span>
<span><i class="dot gold"></i>Sell rate</span>
</div>

<div class="chart-status" id="chartStatus">
Loading rate history...
</div>

</section>

<section class="section">

<h2>Contact Rasheed_Fx</h2>

<div class="actions">

<a class="whatsapp" id="whatsappLink" href="https://wa.me/" target="_blank">
WhatsApp Us
</a>

<a class="share" href="#" onclick="shareWebsite(event)">
Share Website
</a>

</div>

</section>

<footer>
&copy; <span id="year"></span> Rasheed_Fx. All rights reserved.
</footer>

</div>

<script>

let currentRates={};
let historyDays=7;

document.getElementById("year").textContent=
new Date().getFullYear();

const currencyIcons={

USD:'<span class="currency-icon">&#x1F1FA;&#x1F1F8;</span>',

EUR:'<span class="currency-icon">&#x1F1EA;&#x1F1FA;</span>',

GBP:'<span class="currency-icon">&#x1F1EC;&#x1F1E7;</span>',

USDT:'<span class="currency-icon usdt-icon">T</span>'

};

async function loadRates(){

const list=document.getElementById("ratesList");

try{

const response=await fetch("/api/rates",{cache:"no-store"});

if(!response.ok)throw new Error("Rate request failed");

const data=await response.json();

if(!data.success||!data.rates)
throw new Error("Invalid rate data");

currentRates=data.rates;

const currencies=["USD","EUR","GBP","USDT"];

list.innerHTML=currencies.map(currency=>{

const rate=currentRates[currency];

if(!rate){

return `<div class="rate-row">
<span class="currency-name">${currencyIcons[currency]}${currency}</span>
<span class="rate-values">Rate unavailable</span>
</div>`;

}

return `<div class="rate-row">

<span class="currency-name">
${currencyIcons[currency]}${currency}
</span>

<span class="rate-values">

Buy: <strong>₦${Number(rate.buy).toLocaleString()}</strong><br>

Sell: <strong>₦${Number(rate.sell).toLocaleString()}</strong>

</span>

</div>`;

}).join("");

document.getElementById("lastUpdated").textContent=
"Last updated: "+new Date().toLocaleString();

}catch(error){

list.textContent=
"Unable to load rates. Please refresh the page.";

document.getElementById("lastUpdated").textContent=
"Connection error";

}

}

function calculate(){

const currency=
document.getElementById("calculatorCurrency").value;

const amount=
Number(document.getElementById("amount").value);

const type=
document.getElementById("rateType").value;

const rate=currentRates[currency];

if(!rate){

alert("Rates are not available yet.");

return;

}

if(!Number.isFinite(amount)||amount<=0){

alert("Please enter a valid amount.");

return;

}

const value=amount*Number(rate[type]);

document.getElementById("calculationResult").textContent=
"₦"+value.toLocaleString("en-NG",{
minimumFractionDigits:2,
maximumFractionDigits:2
});

}

document.getElementById("historyCurrency")
.addEventListener("change",loadHistory);

function changeDays(days){

historyDays=days;

document.getElementById("days7")
.classList.toggle("active",days===7);

document.getElementById("days30")
.classList.toggle("active",days===30);

loadHistory();

}

async function loadHistory(){

const currency=
document.getElementById("historyCurrency").value;

const status=
document.getElementById("chartStatus");

status.textContent="Loading history...";

try{

const response=await fetch(
`/api/history?currency=${encodeURIComponent(currency)}&days=${historyDays}`,
{cache:"no-store"}
);

if(!response.ok)
throw new Error("History request failed");

const data=await response.json();

if(!data.success||!Array.isArray(data.history))
throw new Error("Invalid history data");

drawHistoryChart(data.history);

}catch(error){

status.textContent=
"Unable to load history. Please try again.";

drawHistoryChart([]);

}

}

function drawHistoryChart(rows){

const canvas=document.getElementById("historyChart");

const status=document.getElementById("chartStatus");

const width=canvas.clientWidth;

const height=canvas.clientHeight;

const ratio=window.devicePixelRatio||1;

canvas.width=width*ratio;

canvas.height=height*ratio;

const ctx=canvas.getContext("2d");

ctx.setTransform(ratio,0,0,ratio,0,0);

ctx.clearRect(0,0,width,height);

if(!rows||rows.length===0){

status.textContent=
"History will appear as rates are updated.";

return;

}

const padding={
left:48,
right:12,
top:20,
bottom:30
};

const chartWidth=
width-padding.left-padding.right;

const chartHeight=
height-padding.top-padding.bottom;

const values=rows.flatMap(row=>[
Number(row.buy),
Number(row.sell)
]).filter(Number.isFinite);

if(!values.length){

status.textContent="No valid history values.";

return;

}

let min=Math.min(...values);

let max=Math.max(...values);

if(min===max){

min-=1;
max+=1;

}

const extra=(max-min)*0.15;

min-=extra;
max+=extra;

function x(index){

return padding.left+
(rows.length===1?
chartWidth/2:
index*chartWidth/(rows.length-1));

}

function y(value){

return padding.top+
(max-value)/(max-min)*chartHeight;

}

ctx.font="10px Arial";

ctx.fillStyle="#aaa";

ctx.strokeStyle="#333";

ctx.lineWidth=1;

for(let i=0;i<=4;i++){

const value=max-(max-min)*i/4;

const yy=y(value);

ctx.beginPath();

ctx.moveTo(padding.left,yy);

ctx.lineTo(width-padding.right,yy);

ctx.stroke();

ctx.fillText(
Math.round(value).toLocaleString(),
2,
yy+4
);

}

function drawLine(key,color){

ctx.beginPath();

ctx.strokeStyle=color;

ctx.lineWidth=2;

let started=false;

rows.forEach((row,index)=>{

const value=Number(row[key]);

if(!Number.isFinite(value))return;

if(!started){

ctx.moveTo(x(index),y(value));

started=true;

}else{

ctx.lineTo(x(index),y(value));

}

});

ctx.stroke();

rows.forEach((row,index)=>{

const value=Number(row[key]);

if(!Number.isFinite(value))return;

ctx.beginPath();

ctx.fillStyle=color;

ctx.arc(x(index),y(value),3,0,Math.PI*2);

ctx.fill();

});

}

drawLine("buy","#35c879");

drawLine("sell","#d8ad45");

status.textContent=
rows.length+" recorded rate updates shown.";

}

async function shareWebsite(event){

event.preventDefault();

const shareData={

title:"Rasheed_Fx Rates",

text:"Check the latest exchange rates on Rasheed_Fx.",

url:window.location.href

};

try{

if(navigator.share){

await navigator.share(shareData);

}else{

await navigator.clipboard.writeText(
window.location.href
);

alert("Website link copied.");

}

}catch(error){

// Sharing was cancelled or unavailable.

}

}

loadRates();

loadHistory();

setInterval(loadRates,30000);

window.addEventListener("resize",loadHistory);

</script>

</body>
