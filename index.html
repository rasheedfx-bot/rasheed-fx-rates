<style>
#fx-chat-button {
  position:fixed;
  right:18px;
  bottom:22px;
  z-index:9999;
  background:#d8ad45;
  color:#080808;
  border:0;
  border-radius:30px;
  padding:15px 20px;
  font-size:15px;
  font-weight:bold;
  box-shadow:0 4px 20px #0009;
}

#fx-chat-box {
  display:none;
  position:fixed;
  right:14px;
  bottom:85px;
  width:min(360px,calc(100vw - 28px));
  height:480px;
  max-height:70vh;
  z-index:9999;
  background:#111;
  border:1px solid #d8ad45;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 30px #000b;
  flex-direction:column;
  font-family:Arial,sans-serif;
}

#fx-chat-header {
  background:#d8ad45;
  color:#080808;
  padding:16px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

#fx-chat-header button {
  background:transparent;
  color:#080808;
  font-size:20px;
  padding:0 5px;
}

#fx-chat-messages {
  flex:1;
  overflow-y:auto;
  padding:13px;
  color:white;
  font-size:14px;
}

.fx-message {
  padding:11px 13px;
  border-radius:12px;
  margin-bottom:10px;
  max-width:90%;
  line-height:1.5;
  white-space:pre-wrap;
}

.fx-bot {
  background:#252525;
  border:1px solid #444;
}

.fx-user {
  background:#d8ad45;
  color:#080808;
  margin-left:auto;
}

#fx-chat-form {
  display:flex;
  padding:10px;
  gap:7px;
  border-top:1px solid #333;
}

#fx-chat-input {
  flex:1;
  min-width:0;
  background:#222;
  color:white;
  border:1px solid #555;
  border-radius:8px;
  padding:12px;
  font-size:14px;
}

#fx-chat-send {
  background:#d8ad45;
  color:#080808;
  border-radius:8px;
  padding:0 16px;
}
</style>

<button id="fx-chat-button" type="button">
  💬 Rasheed_Fx Help
</button>

<div id="fx-chat-box">
  <div id="fx-chat-header">
    <span>✨ Rasheed_Fx Assistant</span>
    <button id="fx-chat-close" type="button">×</button>
  </div>

  <div id="fx-chat-messages">
    <div class="fx-message fx-bot">
      Welcome to Rasheed_Fx! 👋

      I can help you with:
      • Today's exchange rates
      • Currency conversion
      • Buying and selling rates
      • Contact information

      What would you like to know?
    </div>
  </div>

  <form id="fx-chat-form">
    <input
      id="fx-chat-input"
      placeholder="Ask me anything..."
      autocomplete="off"
      required
    >
    <button id="fx-chat-send" type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  const button = document.getElementById("fx-chat-button");
  const box = document.getElementById("fx-chat-box");
  const close = document.getElementById("fx-chat-close");
  const messages = document.getElementById("fx-chat-messages");
  const form = document.getElementById("fx-chat-form");
  const input = document.getElementById("fx-chat-input");

  let liveRates = {};

  const whatsapp = "https://wa.me/2349037125919";

  button.addEventListener("click", () => {
    box.style.display = "flex";
    button.style.display = "none";
    input.focus();
  });

  close.addEventListener("click", () => {
    box.style.display = "none";
    button.style.display = "block";
  });

  async function getRates() {
    try {
      const response = await fetch("/api/rates", {
        cache: "no-store"
      });

      if (!response.ok) throw new Error("Rates unavailable");

      const data = await response.json();

      if (data.success && data.rates) {
        liveRates = data.rates;
      }
    } catch (error) {
      console.log("Could not update assistant rates.");
    }
  }

  function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "fx-message " + type;
    message.textContent = text;

    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;
  }

  function money(value) {
    return "₦" + Number(value).toLocaleString("en-NG", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function answerQuestion(question) {
    const q = question.toLowerCase();

    const currencies = ["USD", "EUR", "GBP", "USDT"];

    if (
      q.includes("rate") ||
      q.includes("price") ||
      q.includes("dollar") ||
      q.includes("euro") ||
      q.includes("pound") ||
      q.includes("usdt")
    ) {
      const found = currencies.find(code => {
        const names = {
          USD: ["usd", "dollar"],
          EUR: ["eur", "euro"],
          GBP: ["gbp", "pound", "sterling"],
          USDT: ["usdt", "tether"]
        };

        return names[code].some(name => q.includes(name));
      });

      if (found && liveRates[found]) {
        const rate = liveRates[found];

        return found + " / NGN\n\n" +
          "Buying rate: " + money(rate.buy) + "\n" +
          "Selling rate: " + money(rate.sell) + "\n\n" +
          "Please confirm the final price before making a transaction.";
      }

      if (Object.keys(liveRates).length) {
        return currencies.map(code => {
          const r = liveRates[code];

          return r
            ? code + "\nBuy: " + money(r.buy) +
              "\nSell: " + money(r.sell)
            : code + ": Rate unavailable";
        }).join("\n\n");
      }

      return "I'm having trouble loading live rates. Please try again shortly.";
    }

    const amountMatch = q.match(/(\d+(?:,\d{3})*(?:\.\d+)?)/);

    if (
      amountMatch &&
      (q.includes("convert") || q.includes("calculate") ||
       q.includes("naira") || q.includes("worth"))
    ) {
      const amount = Number(amountMatch[1].replace(/,/g, ""));

      const currency = currencies.find(code => {
        const names = {
          USD: ["usd", "dollar"],
          EUR: ["eur", "euro"],
          GBP: ["gbp", "pound"],
          USDT: ["usdt", "tether"]
        };

        return names[code].some(name => q.includes(name));
      });

      if (!currency || !liveRates[currency]) {
        return "Please specify the currency, for example: Convert 500 USD to naira.";
      }

      const rate = q.includes("buy")
        ? Number(liveRates[currency].buy)
        : Number(liveRates[currency].sell);

      return amount + " " + currency + " = " +
        money(amount * rate) +
        "\n\nUsing our " +
        (q.includes("buy") ? "buying" : "selling") +
        " rate.";
    }

    if (
      q.includes("contact") ||
      q.includes("whatsapp") ||
      q.includes("phone")
    ) {
      return "You can contact Rasheed_Fx directly on WhatsApp.\n\nTap the link below:\n" + whatsapp;
    }

    if (
      q.includes("hello") ||
      q.includes("hi") ||
      q.includes("good morning") ||
      q.includes("good afternoon")
    ) {
      return "Hello! Welcome to Rasheed_Fx. How can I help you today?";
    }

    if (
      q.includes("buy") ||
      q.includes("sell") ||
      q.includes("service")
    ) {
      return "Rasheed_Fx provides currency exchange information for USD, EUR, GBP and USDT. Contact us on WhatsApp to confirm availability and current prices.";
    }

    if (
      q.includes("market") ||
      q.includes("movement") ||
      q.includes("going up") ||
      q.includes("going down")
    ) {
      return "Exchange rates can change due to market demand, supply and other economic factors. I can show you our current rates, but I cannot predict future market movements.";
    }

    return "I can help with live exchange rates, currency calculations and customer enquiries.\n\nTry asking: What's the dollar rate today?";
  }

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    const question = input.value.trim();

    if (!question) return;

    addMessage(question, "fx-user");

    input.value = "";

    const reply = answerQuestion(question);

    addMessage(reply, "fx-bot");
  });

  getRates();
  setInterval(getRates, 30000);
})();
</script>
<!-- END RASHEED_FX SMART HELP -->
