<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rasheed_Fx Admin</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 480px;
  margin: 40px auto;
  background: #1c1c1c;
  padding: 25px;
  border-radius: 14px;
}
h1 { color: #d6ad50; text-align: center; }
h2 { color: #d6ad50; }
input {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  border: 1px solid #555;
  border-radius: 7px;
  background: #292929;
  color: white;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  background: #d6ad50;
  color: #111;
  border: 0;
  border-radius: 7px;
  font-weight: bold;
  font-size: 16px;
  margin-top: 10px;
}
.currency {
  border-top: 1px solid #444;
  padding: 12px 0;
}
#dashboard { display: none; }
#message { text-align: center; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
  <h1>RASHEED_FX</h1>
  <p style="text-align:center">Admin Dashboard</p>

  <div id="login">
    <h2>Admin Login</h2>
    <input id="username" placeholder="Username" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="login()">Login</button>
  </div>

  <div id="dashboard">
    <h2>Update Exchange Rates</h2>

    <div id="rates"></div>

    <button onclick="saveRates()">Save New Rates</button>
    <hr style="margin:25px 0;border:1px solid #444">

<h2>Manage Website Updates</h2>

<input id="updateTitle" placeholder="Announcement title">

<textarea id="updateMessage"
  placeholder="Write your announcement here..."
  style="width:100%;min-height:120px;padding:12px;background:#292929;color:white;border:1px solid #555;border-radius:7px;font-size:16px;margin-top:10px">
</textarea>

<button onclick="publishUpdate()">Publish Update</button>

<h2>Published Updates</h2>
<div id="updatesList"></div>
    <button onclick="logout()" style="background:#444;color:white">Log Out</button>
  </div>

  <p id="message"></p>
</div>

<script>
const currencies = ["USD", "EUR", "GBP", "USDT"];

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

async function login() {
  showMessage("Checking login...");

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      showMessage(data.error || "Login failed.");
      return;
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("password").value = "";

    await loadRates();
  } catch {
    showMessage("Connection error. Please try again.");
  }
}

async function loadRates() {
  try {
    const response = await fetch("/api/admin/rates", {
      credentials: "same-origin",
      cache: "no-store"
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      showMessage(data.error || "Could not load rates.");
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("login").style.display = "block";
      return;
    }

    const rates = Array.isArray(data.rates)
      ? data.rates
      : Object.entries(data.rates).map(([currency, value]) => ({
          currency, ...value
        }));

    document.getElementById("rates").innerHTML = currencies.map(currency => {
      const rate = rates.find(item => item.currency === currency);

      return `
        <div class="currency">
          <h2>${currency}</h2>
          <label>Buy rate (₦)</label>
          <input type="number" min="0.01" step="0.01"
            id="${currency}_buy" value="${rate ? rate.buy : ""}">
          <label>Sell rate (₦)</label>
          <input type="number" min="0.01" step="0.01"
            id="${currency}_sell" value="${rate ? rate.sell : ""}">
        </div>
      `;
    }).join("");

    showMessage("Rates loaded successfully.");
  } catch {
    showMessage("Unable to connect to the rates database.");
  }
}

async function saveRates() {
  const rates = currencies.map(currency => ({
    currency,
    buy: Number(document.getElementById(currency + "_buy").value),
    sell: Number(document.getElementById(currency + "_sell").value)
  }));

  if (rates.some(rate =>
    !Number.isFinite(rate.buy) ||
    !Number.isFinite(rate.sell) ||
    rate.buy <= 0 ||
    rate.sell < rate.buy
  )) {
    showMessage("Please enter valid rates. Sell must be at least the buy rate.");
    return;
  }

  showMessage("Saving rates...");

  try {
    const response = await fetch("/api/admin/rates", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ rates })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      showMessage(data.error || "Could not save rates.");
      return;
    }

    showMessage("Rates updated successfully!");
  } catch {
    showMessage("Connection error while saving rates.");
  }
}

async function logout() {
  try {
    await fetch("/api/logout", {
      method: "POST",
      credentials: "same-origin"
    });
  } finally {
    location.reload();
  }
}

async function checkLogin() {
  try {
    const response = await fetch("/api/admin/rates", {
      credentials: "same-origin",
      cache: "no-store"
    });

    if (response.ok) {
      document.getElementById("login").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      await loadRates();
    }
  } catch {}
}

checkLogin();
let editingUpdateId = null;

async function loadUpdates() {
  const list = document.getElementById("updatesList");
  if (!list) return;

  try {
    const response = await fetch("/api/admin/updates");
    const data = await response.json();

    if (!response.ok) throw new Error(data.error);

    list.innerHTML = "";

    (data.updates || []).forEach(update => {
      const item = document.createElement("div");
      item.style.cssText =
        "padding:15px;margin:12px 0;background:#292929;border-radius:8px;color:white";

      const title = document.createElement("h3");
      title.textContent = update.title;

      const message = document.createElement("p");
      message.textContent = update.message;

      const edit = document.createElement("button");
      edit.textContent = "Edit";
      edit.onclick = () => {
        editingUpdateId = update.id;
        document.getElementById("updateTitle").value = update.title;
        document.getElementById("updateMessage").value = update.message;
      };

      const remove = document.createElement("button");
      remove.textContent = "Delete";
      remove.style.marginLeft = "10px";
      remove.onclick = () => deleteUpdate(update.id);

      item.append(title, message, edit, remove);
      list.appendChild(item);
    });
  } catch (error) {
    list.textContent = "Unable to load updates. Please log in again.";
  }
}

async function publishUpdate() {
  const title = document.getElementById("updateTitle").value.trim();
  const message = document.getElementById("updateMessage").value.trim();

  if (!title || !message) {
    alert("Enter both a title and message.");
    return;
  }

  try {
    const response = await fetch("/api/admin/updates", {
      method: editingUpdateId ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: editingUpdateId,
        title,
        message
      })
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.error);

    alert(data.message);
    editingUpdateId = null;
    document.getElementById("updateTitle").value = "";
    document.getElementById("updateMessage").value = "";
    loadUpdates();
  } catch (error) {
    alert(error.message || "Could not save update.");
  }
}

async function deleteUpdate(id) {
  if (!confirm("Delete this update?")) return;

  try {
    const response = await fetch("/api/admin/updates", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error);

    alert(data.message);
    loadUpdates();
  } catch (error) {
    alert(error.message || "Could not delete update.");
  }
}

loadUpdates();
</script>
</body>
</html>
